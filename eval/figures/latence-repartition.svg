<svg xmlns='http://www.w3.org/2000/svg' width='720' height='224' viewBox='0 0 720 224'><rect width='720' height='224' fill='white'/><text x='360.0' y='24' text-anchor='middle' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#1f2937'>Latence — répartition du temps de réponse (secondes)</text><text x='240' y='63' text-anchor='end' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937'>Recherche (médiane)</text><rect x='250' y='46' width='380' height='26' fill='#e5e7eb' rx='3'/><rect x='250' y='46' width='13.1' height='26' fill='#2563eb' rx='3'/><text x='638' y='63' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#1f2937'>0.15 s</text><text x='240' y='99' text-anchor='end' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937'>Génération LLM (médiane)</text><rect x='250' y='82' width='380' height='26' fill='#e5e7eb' rx='3'/><rect x='250' y='82' width='365.2' height='26' fill='#d97706' rx='3'/><text x='638' y='99' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#1f2937'>4.19 s</text><text x='240' y='135' text-anchor='end' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937'>Total avec génération (médiane)</text><rect x='250' y='118' width='380' height='26' fill='#e5e7eb' rx='3'/><rect x='250' y='118' width='380.0' height='26' fill='#1f2937' rx='3'/><text x='638' y='135' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#1f2937'>4.36 s</text><text x='240' y='171' text-anchor='end' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2937'>Total, abstention pré-LLM (médiane)</text><rect x='250' y='154' width='380' height='26' fill='#e5e7eb' rx='3'/><rect x='250' y='154' width='12.2' height='26' fill='#16a34a' rx='3'/><text x='638' y='171' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#1f2937'>0.14 s</text><text x='250' y='212' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280'>L'abstention pré-LLM ne paie que la recherche : le modèle n'est jamais appelé.</text></svg>