<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant Juridique — Code du travail</title>
<style>
  :root{
    --bg:#ffffff; --text:#1f1f1f; --muted:#5f6368; --line:#e6e8eb;
    --user-bg:#f0f4f9; --chip:#f6f8fa; --chip-hover:#eaeef3;
    --accent:#4285f4; --grad:linear-gradient(96deg,#4285f4,#9b72cb 55%,#d96570);
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.05);
    --radius:22px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#141518; --text:#e8eaed; --muted:#9aa0a6; --line:#2b2d31;
      --user-bg:#25262b; --chip:#1e2024; --chip-hover:#282a2f; --shadow:0 1px 3px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; flex-direction:column; height:100dvh; max-width:820px; margin:0 auto}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:600; font-size:16px}
  .brand .logo{font-size:20px}
  .brand small{display:block; font-weight:400; font-size:11.5px; color:var(--muted); margin-top:-2px}
  #new-chat{
    border:1px solid var(--line); background:transparent; color:var(--text);
    padding:7px 13px; border-radius:20px; font-size:13.5px; cursor:pointer; transition:.15s;
  }
  #new-chat:hover{background:var(--chip)}

  main{flex:1; overflow-y:auto; padding:22px 20px}
  #messages{display:flex; flex-direction:column; gap:26px}

  /* empty / greeting state */
  #empty{display:flex; flex-direction:column; justify-content:center; min-height:60vh; text-align:left}
  .hero{
    font-size:44px; font-weight:600; margin:0 0 6px; letter-spacing:-.5px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{font-size:19px; color:var(--muted); margin:0 0 30px}
  .chips{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .chip-suggest{
    text-align:left; border:1px solid var(--line); background:var(--chip);
    border-radius:14px; padding:15px 16px; font-size:14.5px; color:var(--text);
    cursor:pointer; transition:.15s; line-height:1.4;
  }
  .chip-suggest:hover{background:var(--chip-hover); transform:translateY(-1px)}
  @media (max-width:560px){.chips{grid-template-columns:1fr} .hero{font-size:34px}}

  /* messages */
  .msg{display:flex; animation:rise .3s ease}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .msg.user{justify-content:flex-end}
  .msg.user .bubble{
    background:var(--user-bg); padding:11px 16px; border-radius:20px 20px 6px 20px; max-width:80%;
  }
  .msg.bot{gap:12px}
  .avatar{
    flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    background:var(--grad); color:#fff; font-size:15px;
  }
  .bot-body{flex:1; min-width:0; padding-top:2px}
  .bot-body p{margin:0 0 10px} .bot-body p:last-child{margin-bottom:0}
  .bot-body ul,.bot-body ol{margin:6px 0 12px; padding-left:22px}
  .bot-body li{margin:3px 0}
  .bot-body code{background:var(--chip); padding:1px 6px; border-radius:6px; font-size:.9em}
  .cite{
    color:var(--accent); font-weight:600; background:rgba(66,133,244,.10);
    padding:0 5px; border-radius:5px; white-space:nowrap;
  }
  .cursor{display:inline-block; width:8px; margin-left:1px; animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  /* sources */
  .sources{margin-top:14px; display:flex; flex-wrap:wrap; gap:8px}
  .src-chip{
    border:1px solid var(--line); background:var(--chip); color:var(--text);
    border-radius:16px; padding:6px 13px; font-size:13px; cursor:pointer; transition:.15s;
    display:flex; align-items:center; gap:6px;
  }
  .src-chip:hover{background:var(--chip-hover)}
  .src-chip .dot{color:var(--accent)}
  .src-card{
    margin-top:10px; border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    background:var(--chip); font-size:14px; animation:rise .2s ease;
  }
  .src-card .path{font-size:12px; color:var(--muted); margin-bottom:8px}
  .src-card .num{font-weight:600; margin-bottom:4px}
  .disclaimer{margin-top:14px; font-size:12px; color:var(--muted); font-style:italic}

  /* composer */
  footer{padding:10px 20px 16px; border-top:1px solid transparent}
  form{
    display:flex; align-items:flex-end; gap:8px; border:1px solid var(--line);
    background:var(--bg); border-radius:var(--radius); padding:8px 8px 8px 18px; box-shadow:var(--shadow);
  }
  #input{
    flex:1; border:0; outline:0; resize:none; background:transparent; color:var(--text);
    font:inherit; max-height:180px; padding:8px 0; line-height:1.5;
  }
  #send{
    flex:none; width:38px; height:38px; border:0; border-radius:50%; cursor:pointer;
    background:var(--grad); color:#fff; font-size:17px; display:grid; place-items:center; transition:.15s;
  }
  #send:disabled{opacity:.4; cursor:default}
  .foot-note{text-align:center; font-size:11.5px; color:var(--muted); margin:9px 0 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo">⚖️</span>
      <div>Assistant Juridique<small>Code du travail marocain · 100 % local</small></div>
    </div>
    <button id="new-chat">＋ Nouvelle conversation</button>
  </header>

  <main id="scroll">
    <div id="empty">
      <h1 class="hero">Bonjour</h1>
      <p class="hero-sub">Posez votre question sur le Code du travail.</p>
      <div class="chips" id="chips"></div>
    </div>
    <div id="messages"></div>
  </main>

  <footer>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Écrivez votre question…" autofocus></textarea>
      <button id="send" type="submit" title="Envoyer">➤</button>
    </form>
    <p class="foot-note">Réponses informatives fondées sur les textes cités. Ne remplacent pas l'avis d'un professionnel du droit.</p>
  </footer>
</div>

<script>
const SUGGESTIONS = [
  "Quelle est la durée du congé de maternité ?",
  "Comment est calculée l'indemnité de licenciement ?",
  "Un employeur peut-il licencier une salariée enceinte ?",
  "À quel âge minimum peut-on travailler ?",
];

const $ = s => document.querySelector(s);
const messagesEl = $("#messages"), emptyEl = $("#empty"), scrollEl = $("#scroll");
const input = $("#input"), sendBtn = $("#send"), form = $("#composer");
let streaming = false;

// suggestion chips
const chipsEl = $("#chips");
SUGGESTIONS.forEach(q => {
  const b = document.createElement("button");
  b.className = "chip-suggest"; b.textContent = q;
  b.onclick = () => { input.value = q; submit(); };
  chipsEl.appendChild(b);
});

function escapeHtml(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// minimal, safe markdown -> html (bold, italic, code, lists, paragraphs)
function renderMarkdown(text){
  let s = escapeHtml(text);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  const lines = s.split("\n"); let html="", ul=false, ol=false;
  const close=()=>{ if(ul){html+="</ul>";ul=false;} if(ol){html+="</ol>";ol=false;} };
  for(const line of lines){
    const t=line.trim();
    if(!t){ close(); continue; }
    const mu=t.match(/^[-*•]\s+(.*)/), mo=t.match(/^\d+[.)]\s+(.*)/);
    if(mu){ if(!ul){close();html+="<ul>";ul=true;} html+="<li>"+mu[1]+"</li>"; }
    else if(mo){ if(!ol){close();html+="<ol>";ol=true;} html+="<li>"+mo[1]+"</li>"; }
    else { close(); html+="<p>"+t+"</p>"; }
  }
  close();
  // highlight article citations
  return html.replace(/\bArticles?\s+(\d{1,3})/g, m => '<span class="cite">'+m+'</span>');
}

function scrollDown(){ scrollEl.scrollTop = scrollEl.scrollHeight; }

function addUser(text){
  emptyEl.style.display="none";
  const el=document.createElement("div");
  el.className="msg user";
  el.innerHTML='<div class="bubble"></div>';
  el.querySelector(".bubble").textContent=text;
  messagesEl.appendChild(el); scrollDown();
}

function addBot(){
  const el=document.createElement("div");
  el.className="msg bot";
  el.innerHTML='<div class="avatar">⚖️</div><div class="bot-body"></div>';
  messagesEl.appendChild(el); scrollDown();
  return el.querySelector(".bot-body");
}

function renderSources(body, sources){
  if(!sources.length) return;
  const wrap=document.createElement("div"); wrap.className="sources";
  sources.forEach(s=>{
    const chip=document.createElement("button");
    chip.className="src-chip";
    chip.innerHTML='<span class="dot">📄</span> Article '+s.number;
    let card=null;
    chip.onclick=()=>{
      if(card){ card.remove(); card=null; return; }
      card=document.createElement("div"); card.className="src-card";
      card.innerHTML=(s.path?'<div class="path">'+escapeHtml(s.path)+'</div>':'')
                    +'<div class="num">Article '+s.number+'</div>'
                    +'<div>'+escapeHtml(s.text)+'</div>';
      body.appendChild(card); scrollDown();
    };
    wrap.appendChild(chip);
  });
  body.appendChild(wrap);
}

async function submit(){
  const q=input.value.trim();
  if(!q || streaming) return;
  streaming=true; sendBtn.disabled=true;
  input.value=""; input.style.height="auto";
  addUser(q);
  const body=addBot();
  let raw="";
  body.innerHTML='<span class="cursor">▍</span>';

  try{
    const res=await fetch("/api/ask",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });
    const reader=res.body.getReader(); const dec=new TextDecoder();
    let buf="";
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const blocks=buf.split("\n\n"); buf=blocks.pop();
      for(const block of blocks){
        const ev=(block.match(/event: (.*)/)||[])[1];
        const dm=block.match(/data: (.*)/s); if(!dm) continue;
        const data=JSON.parse(dm[1]);
        if(ev==="delta"){
          raw+=data.text;
          body.innerHTML=renderMarkdown(raw)+'<span class="cursor">▍</span>';
          scrollDown();
        } else if(ev==="done"){
          body.innerHTML=renderMarkdown(raw);
          renderSources(body,data.sources||[]);
          if(data.disclaimer){
            const d=document.createElement("div"); d.className="disclaimer";
            d.textContent=data.disclaimer; body.appendChild(d);
          }
          scrollDown();
        } else if(ev==="error"){
          body.innerHTML='<p style="color:#d93025">⚠ '+escapeHtml(data.message)+'</p>';
        }
      }
    }
  }catch(e){
    body.innerHTML='<p style="color:#d93025">⚠ Erreur de connexion au serveur.</p>';
  }finally{
    streaming=false; sendBtn.disabled=false; input.focus();
  }
}

form.addEventListener("submit",e=>{e.preventDefault(); submit();});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submit(); }
});
input.addEventListener("input",()=>{
  input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,180)+"px";
});
$("#new-chat").onclick=()=>{
  messagesEl.innerHTML=""; emptyEl.style.display="flex"; input.focus();
};
</script>
</body>
</html>
